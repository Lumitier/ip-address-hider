plugins {
	// Loom 1.19.3 verlangt Gradle >= 9.8.0 und baut mit Java 25.
	// Der Mod-Code selbst bleibt auf Java-Level 21 (siehe unten).
	id 'fabric-loom' version '1.19.3'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// LumiLib - liegt lokal, dorthin veroeffentlicht mit
	// publishToMavenLocal im LumiLib-Projekt.
	mavenLocal()
	mavenCentral()
	// Modrinth-Maven (loest Mod Menu per Projekt/Version-ID auf).
	exclusiveContent {
		forRepository { maven { url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// MixinExtras: Loader liefert es nur im 'development'-Scope, daher explizit
	// einbinden und via include() ins Jar buendeln.
	compileOnly "io.github.llamalad7:mixinextras-common:0.5.5"
	annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.5"
	include(implementation("io.github.llamalad7:mixinextras-fabric:0.5.5"))

	// Mod Menu: NUR zum Kompilieren und fuer die Testumgebung. Es wird
	// nicht mitgebuendelt und steht in der fabric.mod.json unter
	// "suggests" - die Integrationsklasse laedt ueberhaupt nur, wenn Mod
	// Menu da ist.
	//   modmenu cLkYaVuL = 17.0.1
	modCompileOnly "maven.modrinth:modmenu:cLkYaVuL"
	modLocalRuntime "maven.modrinth:modmenu:cLkYaVuL"

	// KEIN YACL. Diese Mod hat zwei Schalter. YACL waere eine knapp
	// megabytegrosse Pflichtinstallation fuer einen Bildschirm aus drei
	// Knoepfen. Der Einstellungsbildschirm ist deshalb selbst geschrieben.

	// LumiLib: OPTIONAL, nicht mitgebuendelt. Mit LumiLib stehen die
	// Einstellungen zusaetzlich im Hub, ohne bleibt es beim eigenen
	// Bildschirm. transitive = false: LumiLibs eigene Abhaengigkeiten
	// (YACL, Quilt-Parser) braucht diese Mod nicht.
	modCompileOnly("com.lumitier.lumilib:lumilib:1.3.2") { transitive = false }
	modLocalRuntime("com.lumitier.lumilib:lumilib:1.3.2") { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
	from("NOTICE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
